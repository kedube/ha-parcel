blueprint:
  name: Parcel - morning delivery briefing
  description: >
    At the time you choose, sends a notification like "3 packages arrive today:
    Coffee grinder, Running shoes and Desk lamp". Nothing is sent on days with no deliveries.
  domain: automation
  source_url: https://github.com/kedube/ha-parcel/blob/main/blueprints/automation/parcel/morning_briefing.yaml
  input:
    arriving_today:
      name: Arriving today sensor
      selector:
        entity:
          filter:
            - integration: parcel
              domain: sensor
    briefing_time:
      name: Time
      default: "08:00:00"
      selector:
        time:
    notify_device:
      name: Phone
      description: A phone with the Home Assistant app.
      selector:
        device:
          filter:
            - integration: mobile_app

mode: single

variables:
  arriving: !input arriving_today

triggers:
  - trigger: time
    at: !input briefing_time

conditions:
  - condition: numeric_state
    entity_id: !input arriving_today
    above: 0

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: Deliveries today
    # One package: "Coffee grinder arrives today". More: "3 packages arrive today: A, B and C".
    message: >-
      {{ state_attr(arriving, 'message') }}{% if states(arriving) | int(0) > 1 %}: {{ state_attr(arriving, 'names') }}{% endif %}
