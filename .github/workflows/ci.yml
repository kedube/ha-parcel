name: CI

# Runs on every push to main and every pull request, and is also the gate the
# Release workflow runs before it publishes anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test requirements
        run: pip install -r requirements-test.txt
      - name: Lint
        run: |
          ruff check custom_components scripts tests
          ruff format --check custom_components scripts tests
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q

  hassfest:
    name: Home Assistant manifest check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit so the step itself can't change unnoticed. What it runs is
      # Home Assistant's current hassfest image, so its rules stay up to date.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-10-26

  hacs:
    name: HACS check
    runs-on: ubuntu-latest
    steps:
      # Includes HACS's brand check, which looks for custom_components/parcel/brand/icon.png.
      # Pinned to a commit like hassfest above; it runs HACS's current checks image.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-06-08
        with:
          category: integration

  panel:
    name: Panel lint, tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        working-directory: frontend-src
        run: npm ci --ignore-scripts
      - name: Lint and tests
        working-directory: frontend-src
        run: |
          npm run lint
          npm test
      - name: Build the panel and the brand images
        working-directory: frontend-src
        run: |
          npm run build
          npm run brand
      - name: The committed builds match their sources
        run: |
          built=(custom_components/parcel/frontend custom_components/parcel/brand brand)
          if [ -n "$(git status --porcelain -- "${built[@]}")" ]; then
            git status --short -- "${built[@]}"
            echo "::error::Built files are out of date. In frontend-src, run 'npm run build' (panel) and 'npm run brand' (logo and icon), then commit the result."
            exit 1
          fi
