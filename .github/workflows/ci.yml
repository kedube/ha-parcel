name: CI

# Runs on every push to main and every pull request, and is also the gate the
# Release workflow runs before it publishes anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test requirements
        run: pip install -r requirements-test.txt
      - name: Lint
        run: |
          ruff check custom_components scripts tests
          ruff format --check custom_components scripts tests
      - name: Tests
        run: pytest -q

  hassfest:
    name: Home Assistant manifest check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS check
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand images are only needed for a listing in the HACS default store.
          ignore: brands

  panel:
    name: Panel build is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build the panel
        working-directory: frontend-src
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: The committed build matches the source
        run: |
          if [ -n "$(git status --porcelain -- custom_components/parcel/frontend)" ]; then
            git status --short -- custom_components/parcel/frontend
            echo "::error::custom_components/parcel/frontend is out of date. Run 'npm run build' in frontend-src and commit the result."
            exit 1
          fi
